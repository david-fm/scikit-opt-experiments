[experiment]
name = "pso_coefficient_analysis"
output_dir = "outputs/runs/pso_coefficient_analysis"
runs = 100
verbose = 1
log_scale = false
track_performance = false

[[tasks]]
objective_id = "rosenbrock"
algorithm_id = "pso"
objective_params = { n_dim = 4 }
subdir_template = "{objective}_{algorithm}"

[[tasks]]
objective_id = "griewank"
algorithm_id = "pso"
objective_params = { n_dim = 4 }
subdir_template = "{objective}_{algorithm}"

[algorithms.pso]
base_params = { w = 0.8, c1 = 0.5, c2 = 0.5, pop = 1000, max_iter = 200 }
name_map = { max_iter = "iter" }
restrictions = ["c1 + c2 <= 4", "0.5 * (c1 + c2) - 1 <= w <= 1"]
on_restriction_violation = "warn"

[[algorithms.pso.sets]]
name = "Low w tests"
variants = [
    { w = 0.1, c1 = 1.1, c2 = 1.1 },
    { w = 0.3, c1 = 1.3, c2 = 1.3 },
    { w = 0.3, c1 = 2.0, c2 = 0.6 },
    { w = 0.3, c1 = 0.6, c2 = 2.0 },
]

[[algorithms.pso.sets]]
name = "Medium w tests"
variants = [
    { w = 0.5, c1 = 1.5, c2 = 1.5 },
    { w = 0.5, c1 = 2.0, c2 = 1.0 },
    { w = 0.5, c1 = 1.0, c2 = 2.0 },
]

[[algorithms.pso.sets]]
name = "High w tests"
variants = [
    { w = 0.7, c1 = 1.7, c2 = 1.7 },
    { w = 0.8, c1 = 1.8, c2 = 1.8 },
    { w = 0.8, c1 = 2.6, c2 = 1.0 },
    { w = 0.8, c1 = 1.0, c2 = 2.6 },
]

[[algorithms.pso.sets]]
name = "Invalid tests"
variants = [
    { w = 0.8, c1 = 3.0, c2 = 3.0 },
    { w = 0.4, c1 = 3.0, c2 = 3.0 },
    { w = -0.8, c1 = 0.5, c2 = 0.5 },
    { w = 2.0, c1 = 2.0, c2 = 2.0 },
]
