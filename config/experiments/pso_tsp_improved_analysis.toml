[experiment]
name = "pso_tsp_improved_analysis"
output_dir = "outputs/runs/experiments_pso_tsp_improved"
runs = 100
verbose = 1
log_scale = false
track_performance = true

[[tasks]]
objective_id = "tsp.berlin52.euclidean_argsort"
algorithm_id = "pso"
objective_params = { tsp_base_path = "data/berlin52" }
subdir_template = "PSO_TSP_improved_Normalized_[0,1]_Argsort"
lb = 0.0
ub = 1.0

[[tasks]]
objective_id = "tsp.berlin52.rankbased"
algorithm_id = "pso"
objective_params = { tsp_base_path = "data/berlin52" }
subdir_template = "PSO_TSP_improved_RankBased"
lb = 0.0
ub = 1.0

[[tasks]]
objective_id = "tsp.berlin52.exponential_sigmoid"
algorithm_id = "pso"
objective_params = { tsp_base_path = "data/berlin52" }
subdir_template = "PSO_TSP_improved_Exponential_Sigmoid"
lb = 0.0
ub = 1.0

[algorithms.pso]
base_params = { w = 0.8, c1 = 0.5, c2 = 0.5, pop = 1000, max_iter = 200 }
name_map = { max_iter = "iter" }

[[algorithms.pso.sets]]
name = "Population Size Analysis"
variants = [{ pop = 20 }, { pop = 50 }, { pop = 1000 }]

[[algorithms.pso.sets]]
name = "Iteration Analysis"
variants = [{ max_iter = 50 }, { max_iter = 200 }, { max_iter = 1000 }]

[[algorithms.pso.sets]]
name = "Low w tests"
variants = [
    { w = 0.1, c1 = 1.1, c2 = 1.1 },
    { w = 0.3, c1 = 1.3, c2 = 1.3 },
    { w = 0.3, c1 = 2.0, c2 = 0.6 },
    { w = 0.3, c1 = 0.6, c2 = 2.0 },
]

[[algorithms.pso.sets]]
name = "Medium w tests"
variants = [
    { w = 0.5, c1 = 1.5, c2 = 1.5 },
    { w = 0.5, c1 = 2.0, c2 = 1.0 },
    { w = 0.5, c1 = 1.0, c2 = 2.0 },
]

[[algorithms.pso.sets]]
name = "High w tests"
variants = [
    { w = 0.7, c1 = 1.7, c2 = 1.7 },
    { w = 0.8, c1 = 1.8, c2 = 1.8 },
    { w = 0.8, c1 = 2.6, c2 = 1.0 },
    { w = 0.8, c1 = 1.0, c2 = 2.6 },
]
